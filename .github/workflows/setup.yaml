name: Installation and Setup Check

on:
  push:
    branches: [main]

jobs:
  installation-and-setup-check:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v4
        with:
          install: false

      - name: install mas
        run: brew install mas

      - name: trust mise config
        run: mise trust mise.toml

      - name: check bootstrap plan
        run: mise -C . bootstrap plan

      - name: check package definitions
        run: mise -C . bootstrap packages apply --dry-run

      - name: check dotfiles
        run: |
          test_home=$(mktemp -d)
          test_config_dir=$(mktemp -d)
          test_state_dir=$(mktemp -d)
          test_mise_config_dir=$(mktemp -d)
          sed \
            -e "s#\"~/#\"$test_home/#g" \
            -e "s#source = \"#source = \"$GITHUB_WORKSPACE/#g" \
            mise.toml > "$test_config_dir/mise.toml"
          export MISE_STATE_DIR="$test_state_dir"
          export MISE_CONFIG_DIR="$test_mise_config_dir"
          mise trust "$test_config_dir/mise.toml"
          mise -C "$test_config_dir" bootstrap dotfiles apply --dry-run
          touch "$test_home/.zprofile"
          if mise -C "$test_config_dir" bootstrap dotfiles apply --dry-run; then
            echo "既存dotfileの衝突を検出できませんでした" >&2
            exit 1
          fi

      - name: check macOS defaults
        run: mise -C . bootstrap macos defaults apply --dry-run

      - name: check bootstrap tasks without installation
        env:
          DOTFILES_CHECK_ONLY: "1"
        run: mise -C "$GITHUB_WORKSPACE" run --skip-tools bootstrap
